name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typetest

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  runtime-smoke:
    name: Runtime Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack
        run: |
          mkdir .artifacts
          npm pack --pack-destination .artifacts

      - name: Create clean consumer
        run: |
          mkdir smoke-consumer
          cd smoke-consumer

          npm init -y
          npm install ../.artifacts/tally-effects-*.tgz

          cp ../tests/smoke/consumer.mjs ./smoke.mjs

      - name: Smoke test Node
        working-directory: smoke-consumer
        run: node smoke.mjs

      - name: Smoke test Bun
        working-directory: smoke-consumer
        run: bun smoke.mjs

      - name: Smoke test Deno
        working-directory: smoke-consumer
        run: deno run --node-modules-dir=manual --allow-read smoke.mjs
